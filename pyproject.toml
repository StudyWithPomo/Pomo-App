[project]
name = "pomo"
version = "0.1.0"
description = "Study Buddy: laptop dashboard + webcam focus tracker in one app"
requires-python = ">=3.10,<3.13"
dependencies = [
    "opencv-contrib-python",
    "mediapipe==0.10.21",
    "numpy",
    "pyyaml",
    "websockets>=14",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
pomo = "pomo.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pomo = ["web/*", "web/schema/*", "web/fonts/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
