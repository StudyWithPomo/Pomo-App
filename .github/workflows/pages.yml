# Publishes the dashboard (src/pomo/web) as a static site. Away from localhost it starts in
# demo mode with a simulated device; Connect device still reaches a real Pomo over Web Serial.
# One-time setup: Settings > Pages > Source: "GitHub Actions".
name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: src/pomo/web
      - id: deployment
        uses: actions/deploy-pages@v4
